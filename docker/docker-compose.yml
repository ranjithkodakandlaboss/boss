version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: boss-postgres
    environment:
      POSTGRES_DB: boss
      POSTGRES_USER: boss
      POSTGRES_PASSWORD: boss
    ports:
      - "5432:5432"
    volumes:
      - boss-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boss -d boss"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: pgAdmin for local DB inspection
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: boss-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@boss.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  boss-pgdata:
