spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/test-migration
  cloud:
    gcp:
      pubsub:
        enabled: false
  autoconfigure:
    exclude:
      - com.google.cloud.spring.autoconfigure.firestore.GcpFirestoreAutoConfiguration
      - com.google.cloud.spring.autoconfigure.pubsub.GcpPubSubAutoConfiguration

boss:
  firebase:
    project-id: boss-test
    credential-path: ""

# Testcontainers sets the datasource URL via DynamicPropertySource
