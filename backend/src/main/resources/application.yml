spring:
  application:
    name: boss-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boss}
    username: ${DB_USER:boss}
    password: ${DB_PASSWORD:boss}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        cloudSqlRefreshStrategy: lazy

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true

  cloud:
    gcp:
      sql:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

boss:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:boss-dev}
    credential-path: ${FIREBASE_CREDENTIAL_PATH:}
