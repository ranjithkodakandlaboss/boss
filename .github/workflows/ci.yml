name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: boss_test
          POSTGRES_USER: boss
          POSTGRES_PASSWORD: boss
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and run unit + integration tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/boss_test
          SPRING_DATASOURCE_USERNAME: boss
          SPRING_DATASOURCE_PASSWORD: boss
          BOSS_FIREBASE_PROJECT_ID: boss-ci
          BOSS_FIREBASE_CREDENTIAL_PATH: ""
        run: mvn -B -ntp verify

      - name: Build and test Platform Admin API
        run: mvn -B -ntp -f backend/platform-admin-api/pom.xml test

      - name: Enforce 80% line coverage on new service classes
        run: ./scripts/check-new-service-coverage.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/target/surefire-reports/
            backend/platform-admin-api/target/surefire-reports/

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same TruffleHog 3.99.9 git scan as the action: full history, verified and unknown results.
      # The action always passes --fail, so the exact local JDBC placeholders are applied here.
      # JDBC detection stays enabled. Any other result fails the job.
      - name: Scan repository for secrets
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/tmp" -w /tmp \
            ghcr.io/trufflesecurity/trufflehog:3.99.9 \
            git file:///tmp/ \
            --results=verified,unknown \
            --no-update \
            --json \
            --no-fail > trufflehog.json
          ./scripts/trufflehog-secret-gate.sh trufflehog.json

  lint-migrations:
    name: Lint Flyway migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration naming convention
        run: |
          # Every migration must follow V{NNN}__{description}.sql
          BAD=$(find backend/src/main/resources/db/migration -name "*.sql" \
                | grep -Ev '/V[0-9]+(_[0-9]+)?__[a-z0-9_]+\.sql$' || true)
          if [ -n "$BAD" ]; then
            echo "Migration naming violation:"
            echo "$BAD"
            exit 1
          fi
          echo "All migrations follow naming convention."

  build-docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Package customer API
        run: mvn -B -ntp -f backend/pom.xml package -DskipTests
      - name: Package Platform Admin API
        run: mvn -B -ntp -f backend/platform-admin-api/pom.xml package -DskipTests
      - name: Build Docker image (no push)
        run: docker build -t boss-api:ci .

      - name: Build Platform Admin Docker image (no push)
        run: docker build -t boss-admin-api:ci -f backend/platform-admin-api/Dockerfile backend/platform-admin-api

      # The scan writes every CRITICAL finding. The next step prints each one and
      # allows only the documented Spring Framework release exceptions.
      # Any other CRITICAL finding still fails this job.
      - name: Scan customer API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: boss-api:ci
          version: v0.70.0
          format: json
          output: trivy-boss-api.json
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library

      - name: Scan Platform Admin image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: boss-admin-api:ci
          version: v0.70.0
          format: json
          output: trivy-boss-admin-api.json
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library

      - name: Enforce CRITICAL gate
        run: |
          ./scripts/trivy-critical-gate.sh trivy-boss-api.json
          ./scripts/trivy-critical-gate.sh trivy-boss-admin-api.json

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-boss-api.json
            trivy-boss-admin-api.json

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    # First run without NVD_API_KEY downloads the full NVD API set and can take about two hours.
    # Later runs reuse the cached database. Set the NVD_API_KEY secret to finish the update in minutes.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-12-${{ hashFiles('backend/pom.xml', 'backend/platform-admin-api/pom.xml') }}
          restore-keys: dependency-check-12-
      - name: Customer API dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          cmd=(mvn -B -ntp -f backend/pom.xml dependency-check:check)
          if [ -n "${NVD_API_KEY}" ]; then
            cmd+=("-DnvdApiKey=${NVD_API_KEY}")
          fi
          "${cmd[@]}"
      - name: Platform Admin dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          cmd=(mvn -B -ntp -f backend/platform-admin-api/pom.xml dependency-check:check)
          if [ -n "${NVD_API_KEY}" ]; then
            cmd+=("-DnvdApiKey=${NVD_API_KEY}")
          fi
          "${cmd[@]}"
      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            backend/target/dependency-check-report.*
            backend/platform-admin-api/target/dependency-check-report.*

  spotbugs:
    name: SpotBugs and Find Security Bugs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: SpotBugs high-severity gate
        run: ./scripts/spotbugs-gate.sh
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: |
            backend/target/spotbugsXml.xml
            backend/platform-admin-api/target/spotbugsXml.xml

  maintainability:
    name: PMD maintainability gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Fail on new maintainability violations
        run: ./scripts/pmd-maintainability-gate.sh
      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: |
            backend/target/pmd.xml
            backend/platform-admin-api/target/pmd.xml

  deploy-dev:
    name: Build, push, and deploy dev
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - secret-scan
      - lint-migrations
      - build-docker
      - dependency-check
      - spotbugs
      - maintainability
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: boss-dev-514813
      GCP_REGION: asia-south1
      ARTIFACT_REGISTRY_REPOSITORY: boss-docker
      IMAGE_NAME: boss-api
      CLOUD_RUN_SERVICE: boss-api-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push customer API image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build --tag "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Deploy customer API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
