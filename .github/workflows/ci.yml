name: CI

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deployment target
        type: choice
        options:
          - admin
          - customer
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-app:
    name: Customer App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/customer-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/customer-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Build Customer App
        env:
          VITE_CUSTOMER_API_URL: ""
        run: |
          set -euo pipefail
          key_file="${GITHUB_WORKSPACE}/src/customer-app/customer-firebase-web-key"
          rm -f "${key_file}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.ref }}" == "refs/heads/main" && "${{ inputs.deploy_target }}" == "customer" ]]; then
            python3 - << 'PY'
          import re, urllib.request
          base = "https://known---boss-customer-web-dev-4pu7albm6a-el.a.run.app"
          html = urllib.request.urlopen(base + "/", timeout=30).read().decode()
          match = re.search(r'src="([^"]+\.js)"', html)
          if not match:
              raise SystemExit("The known Customer App bundle was not found")
          url = match.group(1)
          if url.startswith("/"):
              url = base + url
          script = urllib.request.urlopen(url, timeout=30).read().decode()
          key = re.search(r"AIza[0-9A-Za-z_\-]{20,}", script)
          if not key:
              raise SystemExit("The known Customer App has no Firebase web key")
          with open("customer-firebase-web-key", "w", encoding="utf-8") as handle:
              handle.write(key.group(0))
          PY
            VITE_FIREBASE_API_KEY="$(cat "${key_file}")"
            export VITE_FIREBASE_API_KEY
            echo "::add-mask::${VITE_FIREBASE_API_KEY}"
          fi
          npm run build
          if [[ -n "${VITE_FIREBASE_API_KEY:-}" ]]; then
            python3 - << 'PY'
          from pathlib import Path
          text = "\n".join(path.read_text() for path in Path("dist/static").glob("*.js"))
          if "127.0.0.1" in text or "http://localhost" in text or "localhost:" in text:
              raise SystemExit("The Customer App bundle still points at a local API")
          if "identitytoolkit.googleapis.com" not in text:
              raise SystemExit("The Customer App bundle has no Firebase sign-in")
          print("customer_app_bundle_ok")
          PY
          fi
          rm -f "${key_file}"
      - name: Upload Customer App build
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-dist
          path: src/customer-app/dist/
          if-no-files-found: error

  platform-admin-frontend:
    name: Platform Admin Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLATFORM_ADMIN_FIREBASE_PROJECT_ID: ${{ vars.PLATFORM_ADMIN_FIREBASE_PROJECT_ID }}
      VITE_PLATFORM_ADMIN_FIREBASE_API_KEY: ${{ vars.PLATFORM_ADMIN_FIREBASE_API_KEY }}
      VITE_PLATFORM_ADMIN_FIREBASE_AUTH_DOMAIN: ${{ vars.PLATFORM_ADMIN_FIREBASE_AUTH_DOMAIN }}
      VITE_PLATFORM_ADMIN_FIREBASE_PROJECT_ID: ${{ vars.PLATFORM_ADMIN_FIREBASE_PROJECT_ID }}
      VITE_PLATFORM_ADMIN_FIREBASE_APP_ID: ${{ vars.PLATFORM_ADMIN_FIREBASE_APP_ID }}
      VITE_PLATFORM_ADMIN_API_BASE_URL: /admin/api/v1
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Validate Platform Admin Firebase config for deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_target == 'admin'
        run: |
          set -euo pipefail
          for variable in \
            PLATFORM_ADMIN_FIREBASE_PROJECT_ID \
            VITE_PLATFORM_ADMIN_FIREBASE_API_KEY \
            VITE_PLATFORM_ADMIN_FIREBASE_AUTH_DOMAIN \
            VITE_PLATFORM_ADMIN_FIREBASE_PROJECT_ID \
            VITE_PLATFORM_ADMIN_FIREBASE_APP_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Set the ${variable} repository Actions variable before deploying Platform Admin."
              exit 1
            fi
          done
          if [[ "${VITE_PLATFORM_ADMIN_FIREBASE_PROJECT_ID}" != "${PLATFORM_ADMIN_FIREBASE_PROJECT_ID}" ]]; then
            echo "::error::The Platform Admin web app Firebase project must match PLATFORM_ADMIN_FIREBASE_PROJECT_ID."
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - name: Upload Platform Admin static assets
        uses: actions/upload-artifact@v4
        with:
          name: platform-admin-static
          path: backend/platform-admin-api/src/main/resources/static/
          if-no-files-found: error

  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: boss_test
          POSTGRES_USER: boss
          POSTGRES_PASSWORD: boss
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Platform Admin deployment prerequisite guard
        run: bash scripts/check-admin-dev-prerequisites-test.sh

      - name: Validate deployment target policy
        run: ruby scripts/test-deployment-target-policy.rb

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and run unit + integration tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/boss_test
          SPRING_DATASOURCE_USERNAME: boss
          SPRING_DATASOURCE_PASSWORD: boss
          BOSS_FIREBASE_PROJECT_ID: boss-ci
          BOSS_FIREBASE_CREDENTIAL_PATH: ""
        run: mvn -B -ntp -U verify

      - name: Build and test Platform Admin API
        run: mvn -B -ntp -U -f backend/platform-admin-api/pom.xml test

      - name: Enforce 80% line coverage on new service classes
        run: ./scripts/check-new-service-coverage.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/target/surefire-reports/
            backend/platform-admin-api/target/surefire-reports/

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same TruffleHog 3.99.9 git scan: full history, verified and unknown results.
      # Scanner JSON stays in a file. The gate prints detector, location, and commit only.
      - name: Test secret gate
        run: ./scripts/trufflehog-secret-gate-test.sh
      - name: Scan repository for secrets
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/tmp" -w /tmp \
            ghcr.io/trufflesecurity/trufflehog:3.99.9 \
            git file:///tmp/ \
            --results=verified,unknown \
            --no-update \
            --json \
            --no-fail > trufflehog.json
          ./scripts/trufflehog-secret-gate.sh trufflehog.json

  lint-migrations:
    name: Lint Flyway migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration naming convention
        run: |
          # Every migration must follow V{NNN}__{description}.sql
          BAD=$(find backend/src/main/resources/db/migration -name "*.sql" \
                | grep -Ev '/V[0-9]+(_[0-9]+)?__[a-z0-9_]+\.sql$' || true)
          if [ -n "$BAD" ]; then
            echo "Migration naming violation:"
            echo "$BAD"
            exit 1
          fi
          DUPS=$(find backend/src/main/resources/db/migration -name 'V*.sql' -exec basename {} \; \
                | sed -E 's/^(V[0-9]+(_[0-9]+)?)__.*/\1/' | sort | uniq -d)
          if [ -n "$DUPS" ]; then
            echo "Duplicate Flyway version:"
            echo "$DUPS"
            exit 1
          fi
          echo "All migrations follow naming convention."

  build-docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - platform-admin-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Download Platform Admin frontend
        uses: actions/download-artifact@v4
        with:
          name: platform-admin-static
          path: backend/platform-admin-api/src/main/resources/static
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Package customer API
        run: mvn -B -ntp -U -f backend/pom.xml package -DskipTests
      - name: Package Platform Admin API
        run: mvn -B -ntp -U -f backend/platform-admin-api/pom.xml clean package -DskipTests
      - name: Build Docker image (no push)
        run: docker build -t boss-api:ci .

      - name: Build Platform Admin Docker image (no push)
        run: docker build -t boss-admin-api:ci -f backend/platform-admin-api/Dockerfile backend/platform-admin-api

      # The scan writes every CRITICAL finding. The next step prints each one and
      # allows only the documented Spring Framework release exceptions.
      # Any other CRITICAL finding still fails this job.
      - name: Scan customer API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: boss-api:ci
          version: v0.70.0
          format: json
          output: trivy-boss-api.json
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library

      - name: Scan Platform Admin image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: boss-admin-api:ci
          version: v0.70.0
          format: json
          output: trivy-boss-admin-api.json
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library

      - name: Enforce CRITICAL gate
        run: |
          ./scripts/trivy-critical-gate.sh trivy-boss-api.json
          ./scripts/trivy-critical-gate.sh trivy-boss-admin-api.json

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-boss-api.json
            trivy-boss-admin-api.json

  spotbugs:
    name: SpotBugs and Find Security Bugs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: SpotBugs high-severity gate
        run: ./scripts/spotbugs-gate.sh
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: |
            backend/target/spotbugsXml.xml
            backend/platform-admin-api/target/spotbugsXml.xml

  maintainability:
    name: PMD maintainability gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Fail on new maintainability violations
        run: ./scripts/pmd-maintainability-gate.sh
      - name: Upload PMD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: |
            backend/target/pmd.xml
            backend/platform-admin-api/target/pmd.xml

  deploy-dev:
    name: Build, push, and deploy dev
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_target == 'customer'
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - secret-scan
      - lint-migrations
      - build-docker
      - spotbugs
      - maintainability
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: boss-dev-514813
      GCP_REGION: asia-south1
      ARTIFACT_REGISTRY_REPOSITORY: boss-docker
      IMAGE_NAME: boss-api
      CLOUD_RUN_SERVICE: boss-api-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push customer API image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build --tag "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Deploy customer API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-customer-web-dev:
    name: Build, push, and deploy Customer App dev
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_target == 'customer'
    runs-on: ubuntu-latest
    needs:
      - customer-app
      - build-and-test
      - secret-scan
      - lint-migrations
      - build-docker
      - spotbugs
      - maintainability
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: boss-dev-514813
      GCP_REGION: asia-south1
      ARTIFACT_REGISTRY_REPOSITORY: boss-docker
      IMAGE_NAME: boss-customer-web
      CLOUD_RUN_SERVICE: boss-customer-web-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Customer App build
        uses: actions/download-artifact@v4
        with:
          name: customer-app-dist
          path: src/customer-app/dist

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push Customer App image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build --file src/customer-app/Dockerfile.web --tag "${IMAGE_URI}" src/customer-app
          docker push "${IMAGE_URI}"

      - name: Deploy Customer App image only
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          gcloud run services update "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --image "${IMAGE_URI}" \
            --update-labels "source-sha=${GITHUB_SHA}"
          gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --to-latest

  deploy-admin-dev:
    name: Build, push, and deploy Platform Admin dev
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_target == 'admin'
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - platform-admin-frontend
      - secret-scan
      - lint-migrations
      - build-docker
      - spotbugs
      - maintainability
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: boss-dev-514813
      GCP_REGION: asia-south1
      ARTIFACT_REGISTRY_REPOSITORY: boss
      IMAGE_NAME: boss-admin-api
      CLOUD_RUN_SERVICE: boss-admin-api
      ADMIN_DB_SECRET_NAME: boss-admin-db-password-dev
      PLATFORM_ADMIN_FIREBASE_PROJECT_ID: ${{ vars.PLATFORM_ADMIN_FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Platform Admin frontend
        uses: actions/download-artifact@v4
        with:
          name: platform-admin-static
          path: backend/platform-admin-api/src/main/resources/static

      - name: Check GitHub Actions identity configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [[ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ]]; then
            echo "::error::Set the GCP_WORKLOAD_IDENTITY_PROVIDER repository variable before deploying."
            exit 1
          fi
          if [[ -z "${GCP_SERVICE_ACCOUNT}" ]]; then
            echo "::error::Set the GCP_SERVICE_ACCOUNT repository variable before deploying."
            exit 1
          fi

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Terraform Stage 2 service before image rollout
        run: ./scripts/check-admin-dev-prerequisites.sh

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Package Platform Admin API
        run: mvn -B -ntp -f backend/platform-admin-api/pom.xml clean package -DskipTests

      - name: Build and push Platform Admin image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build --tag "${IMAGE_URI}" -f backend/platform-admin-api/Dockerfile backend/platform-admin-api
          docker push "${IMAGE_URI}"

      - name: Update Platform Admin image only
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          gcloud run services update "${CLOUD_RUN_SERVICE}" \
            --region "${GCP_REGION}" \
            --project "${GCP_PROJECT_ID}" \
            --image "${IMAGE_URI}"
