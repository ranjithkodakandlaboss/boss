openapi: "3.1.0"
info:
  title: BOSS Identity and RBAC API
  version: "1.0.0"
  description: |
    Identity, authentication, tenant context, user management, and RBAC for BOSS.
    Firebase Auth handles password/OAuth; this API manages tenant users, roles, and invite flows.

    **Auth:** Customer endpoints require `Authorization: Bearer {firebase_id_token}`.
    `POST /auth/activate` is public. It accepts the invitation token and ignores a bearer token.

    **Tenant context:** The backend resolves the tenant from the Firebase UID. Callers do not
    send `X-Tenant-Id`. Row-level security uses that resolved tenant.
servers:
  - url: https://api.boss.app/api/v1
    description: Production
  - url: https://api-dev.boss.app/api/v1
    description: Development

security:
  - firebaseBearer: []

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token

  schemas:
    UserProfile:
      type: object
      required: [id, tenantId, email, displayName, status, roles]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        firebaseUid: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        phoneWa: { type: string, description: WhatsApp-registered phone number }
        status:
          type: string
          enum: [active, suspended, deactivated]
        roles:
          type: array
          items: { $ref: '#/components/schemas/UserRole' }
        createdAt: { type: string, format: date-time }

    UserRole:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [OWNER, OPS_MANAGER, SALES_MANAGER, PURCHASE_MANAGER, PRODUCTION_SUPERVISOR,
                 STORE_KEEPER, ACCOUNTS_STAFF, QUALITY_INSPECTOR, FIELD_WORKER]
        siteId: { type: string, format: uuid, nullable: true }
        grantedAt: { type: string, format: date-time }

    InviteRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role:
          type: string
          enum: [OPS_MANAGER, SALES_MANAGER, PURCHASE_MANAGER, PRODUCTION_SUPERVISOR,
                 STORE_KEEPER, ACCOUNTS_STAFF, QUALITY_INSPECTOR, FIELD_WORKER]
        siteId: { type: string, format: uuid, nullable: true }

    InviteResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        status: { type: string, enum: [pending, accepted, expired, cancelled] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    TenantInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [provisioning, active, suspended, archived] }
        planTier: { type: string }
        customerGroupId: { type: string, format: uuid }

    ProblemDetail:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }

    PagedResponse:
      type: object
      properties:
        content: { type: array, items: {} }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

paths:
  /auth/activate:
    post:
      operationId: activateInvitation
      summary: Activate an invitation and create the Firebase user
      description: |
        Accepts the one-time invitation token created for this email. The password is sent to
        Firebase Auth. The plaintext token is not stored. This endpoint is public because the
        caller does not yet have a customer session.
      tags: [Identity]
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 6 }
                displayName: { type: string }
      responses:
        '201':
          description: User activated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { description: Token or password is missing or too short }
        '404': { description: Token was not found }
        '409': { description: Token is no longer pending, or Firebase rejected the user }

  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user profile and tenant context
      description: |
        Called after Firebase sign-in. Returns the activated user profile, roles, and tenant.
        The user row is created by `POST /auth/activate`, not by this call.
      tags: [Identity]
      security:
        - firebaseBearer: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: Invalid or expired JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403':
          description: User is suspended or tenant is suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /users:
    get:
      operationId: listUsers
      summary: List users in this tenant
      tags: [Users]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended, deactivated] }
        - name: role
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Paged user list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/UserProfile' }
        '401': { description: Unauthorised }
        '403': { description: Forbidden — OWNER role required }

  /users/{userId}:
    get:
      operationId: getUser
      summary: Get user by ID
      tags: [Users]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '404': { description: User not found in this tenant }

    patch:
      operationId: updateUser
      summary: Update user display name, phone, or status
      tags: [Users]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                phoneWa: { type: string }
                status: { type: string, enum: [active, suspended, deactivated] }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '403': { description: OWNER role required to change status }

  /users/{userId}/roles:
    put:
      operationId: setUserRoles
      summary: Replace all roles for a user
      description: OWNER role required. Cannot remove OWNER role from last OWNER.
      tags: [Users]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    type: object
                    required: [role]
                    properties:
                      role: { type: string }
                      siteId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '400': { description: Last OWNER cannot have OWNER role removed }
        '403': { description: OWNER role required }

  /invites:
    post:
      operationId: createInvite
      summary: Invite a new user by email
      description: |
        Sends an invite email. On accept, user creates Firebase account and is linked to this tenant.
        Idempotency: same email+role+tenant returns existing pending invite.
      tags: [Invites]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteResponse' }
        '400': { description: Validation error — invalid email or role }
        '403': { description: OWNER role required }
        '409': { description: User with this email already active in tenant }

    get:
      operationId: listInvites
      summary: List pending invites for this tenant
      tags: [Invites]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InviteResponse' }

  /invites/{inviteId}/cancel:
    post:
      operationId: cancelInvite
      summary: Cancel a pending invite
      tags: [Invites]
      parameters:
        - name: inviteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Invite cancelled }
        '404': { description: Invite not found }
        '409': { description: Invite already accepted or expired }

  /tenant/info:
    get:
      operationId: getTenantInfo
      summary: Get basic tenant information for display
      tags: [Tenant]
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantInfo' }
