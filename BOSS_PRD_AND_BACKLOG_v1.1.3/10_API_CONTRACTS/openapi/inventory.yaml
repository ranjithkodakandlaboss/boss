openapi: "3.1.0"
info:
  title: BOSS Inventory API
  version: "1.0.0"
  description: |
    Foundational inventory: material lots, stock movements (append-only), reservations,
    item issue/return for production jobs, and policy-driven replenishment.

    **Concurrency:** All reservation endpoints use `SELECT FOR UPDATE` pessimistic locking.
    The `InventoryConcurrencyIntegrationTest` (10 threads, 6 available) must pass.

    **Append-only:** `stock_movements` can only be created, never updated or deleted.
    DB trigger enforces this.

servers:
  - url: https://api.boss.app/api/v1

security:
  - firebaseBearer: []

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MaterialLot:
      type: object
      required: [id, itemId, storeId, qty, reservedQty, unitCost, status]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemCode: { type: string }
        itemName: { type: string }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        siteId: { type: string, format: uuid }
        batchRef: { type: string, nullable: true }
        grnLineId: { type: string, format: uuid, nullable: true }
        qty: { type: number, description: "Current physical quantity" }
        reservedQty: { type: number, description: "Reserved but not yet issued" }
        availableQty: { type: number, description: "qty - reservedQty (computed)" }
        unitCost: { type: number }
        uomId: { type: string, format: uuid }
        uomSymbol: { type: string }
        status:
          type: string
          description: |
            API statuses are `available`, `quarantine`, `reserved`, `depleted`, and `disposed`.
            V016 stores the exhausted status as `consumed`. This API accepts `depleted` on input
            and returns `depleted` for a stored `consumed` row. `disposed` is stored and returned
            as `disposed`.
            Lot creation accepts only `available` (default) or `quarantine`.
            Later explicit transitions:
            `available` → `quarantine`; `available` → `reserved` only when reservedQty equals qty and qty > 0;
            `available` or `quarantine` or `reserved` → `depleted` or `disposed` only when qty is 0;
            `quarantine` → `available` when qty > 0;
            `reserved` → `available` only when reservedQty is 0 and qty > 0.
            `depleted` has no explicit transition back; an inbound movement restores `available`.
            `disposed` is terminal.
          enum: [available, quarantine, reserved, depleted, disposed]
        expiryDate: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }

    StockMovement:
      type: object
      required: [id, lotId, movementType, qty, createdAt]
      properties:
        id: { type: string, format: uuid }
        lotId: { type: string, format: uuid }
        movementType:
          type: string
          description: |
            V016 movement token. A generic ADJUSTMENT value is not accepted;
            use adjustment_add or adjustment_reduce.
          enum:
            - receipt
            - issue
            - return
            - transfer_out
            - transfer_in
            - adjustment_add
            - adjustment_reduce
            - opening_balance
            - scrap
            - consume
        qty:
          type: number
          description: |
            Signed on responses: positive inbound, negative outbound.
            Create and append requests send an absolute quantity; the movement type sets the direction.
        referenceType: { type: string, nullable: true, description: "GRN | JOB | TRANSFER | ADJUSTMENT" }
        referenceId: { type: string, format: uuid, nullable: true }
        performedBy: { type: string, format: uuid }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    InventoryPosition:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        itemCode: { type: string }
        itemName: { type: string }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        totalQty:
          type: number
          description: |
            Physical quantity of available and reserved lots. Quarantine, depleted, and disposed lots are excluded.
        reservedQty:
          type: number
          description: |
            Sum of material_lots.reserved_qty for the included lots. Active stock_reservation_records are not added again.
        availableQty:
          type: number
          description: "totalQty minus reservedQty"
        inTransitQty:
          type: number
          description: "Dispatched quantity for this item and store that has not been received yet"
        reorderPoint:
          type: number
          nullable: true
          description: "Active store policy threshold, or the item's legacy reorder quantity when no policy is configured"
        valuationAmt:
          type: number
          description: "Sum of physical qty * unit_cost for the included lots"
        uomSymbol: { type: string }
        lastMovedAt: { type: string, format: date-time, nullable: true }

    ReservationRequest:
      type: object
      required: [jobId, requirements]
      properties:
        jobId: { type: string, format: uuid }
        requirements:
          type: array
          items:
            type: object
            required: [itemId, storeId, qty]
            properties:
              itemId: { type: string, format: uuid }
              storeId: { type: string, format: uuid }
              qty: { type: number, minimum: 0.001 }

    ReservationResult:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        status:
          type: string
          enum: [FULLY_RESERVED, PARTIALLY_RESERVED, FAILED]
        lines:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid }
              storeId:
                type: string
                format: uuid
                nullable: true
                description: Null when a job's BOM requirements are allocated across site stores
              requested: { type: number }
              reserved: { type: number }
              shortfall: { type: number }
              allocations:
                type: array
                items:
                  type: object
                  required: [lotId, qty]
                  properties:
                    lotId: { type: string, format: uuid }
                    qty: { type: number }

    CustomerPoReservationRequest:
      type: object
      required: [cpoId, lines]
      properties:
        cpoId: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [cpoLineId, storeId, qty]
            properties:
              cpoLineId: { type: string, format: uuid }
              storeId: { type: string, format: uuid }
              qty: { type: number, minimum: 0.001 }

    CustomerPoReservationResult:
      type: object
      properties:
        cpoId: { type: string, format: uuid }
        status:
          type: string
          enum: [FULLY_RESERVED, PARTIALLY_RESERVED, FAILED]
        lines:
          type: array
          items:
            type: object
            properties:
              cpoLineId: { type: string, format: uuid }
              itemId: { type: string, format: uuid }
              storeId: { type: string, format: uuid }
              requested: { type: number }
              reserved: { type: number }
              shortfall: { type: number }
              allocations:
                type: array
                items:
                  type: object
                  required: [lotId, qty]
                  properties:
                  lotId: { type: string, format: uuid }
                  qty: { type: number }

    IssueRequest:
      type: object
      required: [jobId, lotId, qty]
      properties:
        jobId: { type: string, format: uuid }
        lotId: { type: string, format: uuid }
        qty: { type: number, minimum: 0.001 }
        note: { type: string, nullable: true }

    ReturnRequest:
      type: object
      required: [jobId, lotId, qty]
      properties:
        jobId: { type: string, format: uuid }
        lotId: { type: string, format: uuid }
        qty: { type: number, minimum: 0.001 }
        returnReason: { type: string, nullable: true }

    ReorderPolicyRequest:
      type: object
      required: [itemId, storeId, reorderPoint, reorderQty]
      properties:
        itemId: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        reorderPoint: { type: number, minimum: 0 }
        reorderQty: { type: number, exclusiveMinimum: 0 }
        maxStock: { type: number, exclusiveMinimum: 0, nullable: true }
        leadTimeDays: { type: integer, minimum: 0, nullable: true }
        preferredSupplierId: { type: string, format: uuid, nullable: true }
        active: { type: boolean, default: true }

    ReorderPolicy:
      allOf:
        - $ref: '#/components/schemas/ReorderPolicyRequest'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }

    ProblemDetail:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }

    CreateLotRequest:
      type: object
      required: [itemId, storeId, qty]
      properties:
        itemId: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        qty: { type: number, minimum: 0.001, description: "Opening physical quantity" }
        unitCost: { type: number, minimum: 0, nullable: true }
        batchRef: { type: string, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }
        status:
          type: string
          enum: [available, quarantine]
          default: available
          description: "Initial status only. reserved, depleted, and disposed are not valid on create."
        grnLineId:
          type: string
          format: uuid
          nullable: true
          description: |
            When set, the opening movement is receipt with referenceType GRN.
            The line must already exist in this tenant and its item_id and store_id must match this request.
            When omitted, the opening movement is opening_balance.
            GRN inspection outcome and GRN status changes are not applied here.

    AddMovementRequest:
      type: object
      required: [movementType, qty]
      properties:
        movementType:
          type: string
          description: "Absolute-quantity movement. ADJUSTMENT is not a valid token."
          enum:
            - receipt
            - issue
            - return
            - transfer_out
            - transfer_in
            - adjustment_add
            - adjustment_reduce
            - opening_balance
            - scrap
            - consume
        qty:
          type: number
          minimum: 0.001
          description: "Absolute quantity. The response qty is signed."
        referenceType: { type: string, nullable: true, description: "GRN | JOB | TRANSFER | ADJUSTMENT" }
        referenceId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }

    InterSiteTransfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        transferNumber: { type: string }
        fromStoreId: { type: string, format: uuid }
        fromStoreName: { type: string }
        toStoreId: { type: string, format: uuid }
        toStoreName: { type: string }
        status: { type: string, enum: [pending, in_transit, received, cancelled] }
        transferDate: { type: string, format: date }
        lines:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              lotId: { type: string, format: uuid }
              itemCode: { type: string }
              itemName: { type: string }
              qty: { type: number }
              uomSymbol: { type: string }
        createdAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time, nullable: true }

paths:
  /inventory/features:
    get:
      operationId: getInventoryFeatureFlags
      summary: Get the effective inventory capabilities for the current tenant
      description: |
        Capabilities are read from the shared tenant_entitlements table. Missing rows default to
        enabled; explicit disabled rows reject matching writes with HTTP 403.
      tags: [Inventory]
      responses:
        '200':
          description: Effective inventory capability values by feature key
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean

  /inventory/positions:
    get:
      operationId: getInventoryPositions
      summary: Get current inventory positions (lot balances by item and store)
      description: |
        Aggregates available and fully reserved lots. A reserved lot still contributes its physical
        quantity to totalQty and its reserved_qty to reservedQty, so availableQty is zero for that lot.
        Quarantine, depleted, and disposed lots are omitted. Reservation rows are not summed on top of
        material_lots.reserved_qty. inTransitQty includes dispatched transfers not yet received.
      tags: [Inventory Position]
      parameters:
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: siteId
          in: query
          schema: { type: string, format: uuid }
        - name: belowReorderPoint
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Paged inventory positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryPosition' }
                  page: { type: integer }
                  totalElements: { type: integer }

  /inventory/lots:
    get:
      operationId: listLots
      summary: List material lots with filters
      tags: [Lots]
      parameters:
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [available, quarantine, reserved, depleted, disposed] }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/MaterialLot' }
                  page: { type: integer }
                  totalElements: { type: integer }
    post:
      operationId: createLot
      summary: Create a material lot and its opening stock movement
      description: |
        Inserts one material lot and one append-only movement for the opening quantity.
        Initial status is available or quarantine. A repeat Idempotency-Key with the same body
        returns the original lot and does not insert a second row.
      tags: [Lots]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLotRequest' }
      responses:
        '201':
          description: Lot created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialLot' }
        '400':
          description: Invalid item, store, quantity, initial status, or GRN line reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { description: Authentication required }
        '403': { description: STORE_KEEPER, OPS_MANAGER, or OWNER role required }
        '409':
          description: Idempotency-Key reused with a different request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /inventory/lots/{lotId}:
    get:
      operationId: getLot
      summary: Get a specific lot with movement history
      tags: [Lots]
      parameters:
        - name: lotId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialLot' }
        '404': { description: Lot not found in this tenant }

  /inventory/lots/{lotId}/movements:
    get:
      operationId: getLotMovements
      summary: Get append-only movement history for a lot
      tags: [Movements]
      parameters:
        - name: lotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 100 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/StockMovement' }
                  page: { type: integer }
                  totalElements: { type: integer }
    post:
      operationId: addMovement
      summary: Append one stock movement to a lot
      description: |
        Inserts a stock_movements row and updates the lot quantity. The row is never updated or deleted.
        Request qty is absolute. The response qty is signed: positive inbound, negative outbound.
        A movement that would take quantity below the reserved quantity is rejected.
        Scrap of the remaining quantity sets disposed. Any other outbound that reaches zero sets depleted
        (stored as consumed). Disposed lots reject further movements.
      tags: [Movements]
      parameters:
        - name: lotId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMovementRequest' }
      responses:
        '201':
          description: Movement appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovement' }
        '400':
          description: Unknown movement type, or quantity exceeds the unreserved balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { description: Authentication required }
        '403': { description: STORE_KEEPER, OPS_MANAGER, or OWNER role required }
        '404':
          description: Lot not found in this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Invalid lot status transition, or Idempotency-Key reused with a different body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /inventory/reservations:
    post:
      operationId: checkAndReserve
      summary: Check availability and reserve materials for a production job
      description: |
        Atomic pessimistic reservation. Uses SELECT FOR UPDATE per lot.
        The whole request is atomic. If any line cannot be fully satisfied, no stock is reserved
        unless partial=true, in which case every line is allocated as far as available stock permits.
        A job can have only one active reservation request; release it before requesting again.
      tags: [Reservations]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
        - name: partial
          in: query
          schema: { type: boolean, default: false }
          description: If true, reserve what is available even if not all lines can be met
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResult' }
        '409':
          description: Insufficient stock for full reservation (and partial=false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResult' }

  /inventory/reservations/{jobId}:
    delete:
      operationId: releaseReservations
      summary: Release all reservations for a production job
      tags: [Reservations]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Reservations released }
        '404': { description: No reservations found for this job }

  /inventory/reservations/{jobId}/requirements:
    post:
      operationId: reserveJobMaterialRequirements
      summary: Reserve a production job's unissued BOM material requirements
      description: |
        Allocates eligible lots across stores at the job's site. Existing job material requirements
        remain the authoritative snapshot. If none exist, the service explodes the approved BOM once,
        persists its leaf materials as the job snapshot, and then reserves those requirements.
        Requirements and eligible lots are locked; the operation is all-or-nothing unless partial=true.
      tags: [Reservations]
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
        - name: partial
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResult' }
        '409':
          description: Insufficient stock for full reservation or an active reservation already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationResult' }

  /inventory/reservations/customer-pos:
    post:
      operationId: reserveForCustomerPo
      summary: Reserve stock against Customer PO lines
      description: |
        Reserves the CPO line item quantities from stores at the order's site. Every reservation row
        is linked to its CPO line. Already delivered and actively reserved quantities are excluded
        from the line's remaining demand. An all-or-nothing request makes no changes when stock is
        insufficient; partial=true reserves available stock and returns line-level shortfalls.
        A user-confirmed shortage can be raised through POST /prs with originType=customer_po,
        customerPoId set to cpoId, and PR lines populated from the returned shortfall quantities.
      tags: [Reservations]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
        - name: partial
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPoReservationRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPoReservationResult' }
        '409':
          description: Insufficient stock for full reservation or invalid Customer PO state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPoReservationResult' }

  /inventory/reservations/customer-pos/{cpoId}:
    delete:
      operationId: releaseCustomerPoReservations
      summary: Release active reservations for a Customer PO
      tags: [Reservations]
      parameters:
        - name: cpoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Reservations released }

  /inventory/issues:
    post:
      operationId: issueMaterial
      summary: Issue material from a lot to a production job
      description: Reduces lot qty and reserved_qty; writes stock movement.
      tags: [Issues and Returns]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovement' }
        '400': { description: Requested qty exceeds lot available qty }
        '404': { description: Lot not found }
        '409': { description: Idempotency key already processed }

  /inventory/returns:
    post:
      operationId: returnMaterial
      summary: Return unused material from a production job back to store
      tags: [Issues and Returns]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovement' }
        '400': { description: Returned qty exceeds issued qty for this job and lot }

  /inventory/reorder-policies:
    get:
      operationId: listReorderPolicies
      summary: List reorder policies
      tags: [Replenishment]
      parameters:
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          description: Paged reorder policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/ReorderPolicy' }
                  page: { type: integer }
                  totalElements: { type: integer }
    post:
      operationId: upsertReorderPolicy
      summary: Create or replace the reorder policy for one item and store
      tags: [Replenishment]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderPolicyRequest' }
      responses:
        '200':
          description: Policy saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReorderPolicy' }
        '400': { description: Invalid item, store, supplier, or reorder threshold }

  /inventory/adjustments:
    post:
      operationId: adjustStock
      summary: Manual stock adjustment (STORE_KEEPER or OWNER role)
      description: |
        Not the lots movement API. POST /inventory/lots/{lotId}/movements does not accept
        a generic ADJUSTMENT token; persisted adjustments are adjustment_add or adjustment_reduce.
        This reason-coded adjustment endpoint is outside the lots-and-movements implementation.
      tags: [Adjustments]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lotId, qty, adjustmentReasonId, adjustmentReasonLabel]
              properties:
                lotId: { type: string, format: uuid }
                qty: { type: number, description: "Signed quantity — positive increases, negative decreases" }
                adjustmentReasonId: { type: string, format: uuid }
                adjustmentReasonLabel: { type: string, description: "Snapshot label at time of adjustment" }
                note: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovement' }
        '403': { description: STORE_KEEPER or OWNER role required }

  /inventory/replenishment-requests:
    get:
      operationId: listReplenishmentRequests
      summary: List replenishment requests (auto-generated by reorder policy)
      description: |
        Read from `replenishment_requests` table. Created automatically when stock
        falls below reorder point per `reorder_policies`. Linked to a PR once actioned.
      tags: [Replenishment]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, pr_created, fulfilled, cancelled] }
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: itemId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        itemId: { type: string, format: uuid }
                        itemCode: { type: string }
                        itemName: { type: string }
                        storeId: { type: string, format: uuid }
                        storeName: { type: string }
                        policyId: { type: string, format: uuid, nullable: true }
                        requestedQty: { type: number }
                        status: { type: string }
                        prId: { type: string, format: uuid, nullable: true }
                        createdAt: { type: string, format: date-time }
                  totalElements: { type: integer }
                  page: { type: integer }

  /inventory/replenishment-requests/{requestId}/cancel:
    post:
      operationId: cancelReplenishmentRequest
      summary: Cancel a replenishment request
      tags: [Replenishment]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [cancelled] }
        '409': { description: Only pending requests can be cancelled }

  /inter-site-transfers:
    get:
      operationId: listInterSiteTransfers
      summary: List inter-site stock transfers
      description: |
        Stock movements between stores/sites. Each transfer records a negative movement
        at the source store and a positive movement at the destination store.
        Both movements are appended to `stock_movements` (never updated/deleted).
      tags: [Inter-Site Transfers]
      parameters:
        - name: fromStoreId
          in: query
          schema: { type: string, format: uuid }
        - name: toStoreId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [pending, in_transit, received, cancelled] }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/InterSiteTransfer' }
                  totalElements: { type: integer }
                  page: { type: integer }
                  size: { type: integer }
    post:
      operationId: createInterSiteTransfer
      summary: Create inter-site transfer
      description: |
        Dispatches the transfer immediately: unreserved quantities are removed from the source
        lots, transfer_out movements are appended, and the response status is in_transit.
      tags: [Inter-Site Transfers]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromStoreId, toStoreId, lines]
              properties:
                fromStoreId: { type: string, format: uuid }
                toStoreId: { type: string, format: uuid }
                transferDate: { type: string, format: date }
                note: { type: string, nullable: true }
                lines:
                  type: array
                  items:
                    type: object
                    required: [lotId, qty]
                    properties:
                      lotId: { type: string, format: uuid }
                      qty: { type: number }
      responses:
        '201':
          description: Transfer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterSiteTransfer' }
        '400':
          description: Invalid store, unavailable or expired lot, or insufficient unreserved stock
        '404':
          description: Source lot not found

  /inter-site-transfers/{id}/receive:
    post:
      operationId: receiveInterSiteTransfer
      summary: Confirm receipt at destination store
      tags: [Inter-Site Transfers]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                receivedNote: { type: string, nullable: true }
      responses:
        '200':
          description: Transfer received — destination stock movements appended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterSiteTransfer' }
        '409': { description: Already received or cancelled }
