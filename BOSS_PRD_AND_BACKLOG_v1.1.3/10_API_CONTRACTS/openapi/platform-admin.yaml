openapi: "3.1.0"
info:
  title: BOSS Platform Admin API
  version: "1.0.0"
  description: |
    Internal BOSS operations: tenant provisioning, activation/suspension,
    industry defaults management, and opening balance migration.

    **Auth:** This API uses a SEPARATE Firebase project. Customer JWTs are REJECTED
    with 403 (AdminApiCustomerTokenRejectionTest must pass).

    **Base URL:** Different service — boss-admin-api, NOT boss-api.

servers:
  - url: https://admin-api.boss.app/admin/api/v1
    description: Production admin
  - url: https://admin-api-dev.boss.app/admin/api/v1
    description: Development admin

security:
  - adminFirebaseBearer: []

components:
  securitySchemes:
    adminFirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin-specific Firebase ID token (separate Firebase project)

  schemas:
    TenantProvisionRequest:
      type: object
      required: [customerGroupName, tenantName, tenantSlug, legalEntityName, pan, entityType, siteCode, siteName, industryType]
      properties:
        customerGroupName: { type: string }
        customerGroupSlug: { type: string }
        tenantName: { type: string }
        tenantSlug: { type: string }
        planTier: { type: string, default: pilot }
        legalEntityName: { type: string }
        pan: { type: string, pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$' }
        entityType:
          type: string
          enum: [PRIVATE_LIMITED, LLP, SOLE_PROPRIETORSHIP, PARTNERSHIP, PUBLIC_LIMITED, HUF, OTHER]
        siteCode: { type: string }
        siteName: { type: string }
        adminEmail:
          type: string
          format: email
          description: Stored as the intended administrator contact. Invitation delivery occurs only on explicit tenant activation.
        industryType:
          type: string
          enum: [FABRICATION_STEEL, PRECISION_MACHINING, ELECTRONICS_ASSEMBLY, FORGING, CASTING, GENERAL_MANUFACTURING]

    ProvisionResult:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        customerGroupId: { type: string, format: uuid }
        legalEntityId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        seedingApplied: { type: boolean }
        invitationStatus:
          type: string
          enum: [NOT_REQUESTED, PENDING_ACTIVATION, CREATED, RETRY_REQUIRED]

    TenantActivationResult:
      type: object
      required: [tenantId, tenantStatus, invitationStatus]
      properties:
        tenantId: { type: string, format: uuid }
        tenantStatus: { type: string, enum: [active] }
        invitationStatus:
          type: string
          enum: [NOT_REQUESTED, CREATED, RETRY_REQUIRED]

    TenantDetails:
      type: object
      required:
        [tenantId, customerGroupId, customerGroupName, customerGroupSlug, tenantName, tenantSlug,
         tenantStatus, planTier, industryType, invitationStatus, adminEmail, workspaceUrl, legalEntities, sites]
      properties:
        tenantId: { type: string, format: uuid }
        customerGroupId: { type: string, format: uuid }
        customerGroupName: { type: string }
        customerGroupSlug: { type: string }
        tenantName: { type: string }
        tenantSlug: { type: string }
        tenantStatus: { type: string, enum: [provisioning, active, suspended, archived] }
        planTier: { type: string }
        industryType: { type: [string, "null"] }
        invitationStatus: { type: string }
        adminEmail: { type: [string, "null"], format: email }
        workspaceUrl: { type: [string, "null"], format: uri }
        legalEntities:
          type: array
          items:
            type: object
            required: [id, name, legalName, pan, entityType, registeredAddress, status, gstRegistrations]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              legalName: { type: string }
              pan: { type: [string, "null"] }
              entityType: { type: string }
              registeredAddress: { type: [string, "null"] }
              status: { type: string }
              gstRegistrations:
                type: array
                items:
                  type: object
                  required:
                    [id, gstin, tradeName, registrationType, stateCode, status, effectiveFrom, effectiveTo]
                  properties:
                    id: { type: string, format: uuid }
                    gstin: { type: string }
                    tradeName: { type: [string, "null"] }
                    registrationType: { type: string }
                    stateCode: { type: string }
                    status: { type: string }
                    effectiveFrom: { type: string, format: date }
                    effectiveTo: { type: [string, "null"], format: date }
        sites:
          type: array
          items:
            type: object
            required: [id, legalEntityId, gstRegistrationId, name, code, siteType, address, status]
            properties:
              id: { type: string, format: uuid }
              legalEntityId: { type: string, format: uuid }
              gstRegistrationId: { type: [string, "null"], format: uuid }
              name: { type: string }
              code: { type: string }
              siteType: { type: string }
              address: { type: [string, "null"] }
              status: { type: string }

    TenantDetailsUpdateRequest:
      type: object
      minProperties: 1
      properties:
        tenantName: { type: string, maxLength: 120 }
        legalEntities:
          type: array
          items:
            type: object
            required: [id]
            minProperties: 2
            properties:
              id: { type: string, format: uuid }
              name: { type: string, maxLength: 160 }
              legalName: { type: string, maxLength: 200 }
              registeredAddress: { type: string, maxLength: 1000 }
        sites:
          type: array
          items:
            type: object
            required: [id]
            minProperties: 2
            properties:
              id: { type: string, format: uuid }
              name: { type: string, maxLength: 120 }
              address: { type: string, maxLength: 1000 }

    TenantDetailsUpdateResult:
      type: object
      required: [tenantId, updatedFields]
      properties:
        tenantId: { type: string, format: uuid }
        updatedFields:
          type: array
          items: { type: string }

    OpeningBalanceImportRequest:
      type: object
      required: [tenantId, importType]
      properties:
        tenantId: { type: string, format: uuid }
        importType:
          type: string
          enum: [INVENTORY, AR, AP, ALL]
        dryRun: { type: boolean, default: true }
        fileGcsPath: { type: string }

    OpeningBalanceResult:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
        importType: { type: string }
        dryRun: { type: boolean }
        rowsProcessed: { type: integer }
        rowsSucceeded: { type: integer }
        rowsFailed: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              field: { type: string }
              message: { type: string }

paths:
  /tenants:
    post:
      operationId: provisionTenant
      summary: Provision a new tenant (atomic — creates group, tenant, entity, site, seeds defaults)
      tags: [Tenant Management]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantProvisionRequest' }
      responses:
        '201':
          description: Tenant created in provisioning status. An administrator email is stored as the intended contact; invitation delivery occurs only after explicit activation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisionResult' }
        '400': { description: Validation error — invalid PAN or slug }
        '409': { description: Tenant slug already exists, or this Idempotency-Key was used with a different payload }

    get:
      operationId: listTenants
      summary: List all tenants
      tags: [Tenant Management]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [provisioning, active, suspended, archived] }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        slug: { type: string }
                        status: { type: string }
                        planTier: { type: string }
                        industryType: { type: string }
                        invitationStatus: { type: string }
                        adminEmail: { type: string, format: email }
                        workspaceUrl: { type: string, format: uri }
                  page: { type: integer }
                  totalElements: { type: integer }

  /tenants/{tenantId}:
    get:
      operationId: getTenantDetails
      summary: View a tenant and its associated company and site details
      tags: [Tenant Management]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDetails' }
        '404': { description: Tenant was not found }

  /tenants/{tenantId}/details:
    patch:
      operationId: updateTenantDetails
      summary: Update permitted tenant, legal-entity, and site display details
      description: |
        Updates tenant and company display names and addresses only. Tenant/entity/site
        identifiers, legal identifiers, entity/site types, lifecycle, plan, and industry
        are not editable through this endpoint. Entity and site writes are scoped by
        tenant context and row-level security.
      tags: [Tenant Management]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantDetailsUpdateRequest' }
      responses:
        '200':
          description: Customer details updated. The result contains no company/contact data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantDetailsUpdateResult' }
        '400': { description: No editable detail or invalid value was supplied }
        '404': { description: Tenant or tenant-associated entity/site was not found }
        '409': { description: Archived tenant details cannot be edited }

  /tenants/{tenantId}/activate:
    post:
      operationId: activateTenant
      summary: Activate a provisioning tenant after seeding; send an administrator invitation when an email was configured
      tags: [Tenant Management]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Tenant activated. Invitation delivery, when requested, is reported separately and does not roll back activation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantActivationResult' }
        '409': { description: Tenant is not provisioning or industry seeding is incomplete }

  /tenants/{tenantId}/suspend:
    post:
      operationId: suspendTenant
      summary: Suspend a tenant (all API calls return 403 immediately)
      tags: [Tenant Management]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Tenant suspended }
        '400': { description: Reason is missing }
        '409': { description: Tenant is already suspended, archived, or not yet active }

  /tenants/{tenantId}/reactivate:
    post:
      operationId: reactivateTenant
      summary: Reactivate a suspended tenant
      tags: [Tenant Management]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Tenant reactivated }
        '409': { description: Tenant is not suspended }

  /tenants/{tenantId}/admin-invite:
    post:
      operationId: retryInitialAdminInvite
      summary: Create or retry the initial tenant administrator invitation
      description: |
        Calls the customer identity service for an OWNER invitation in the customer Firebase project.
        The one-time token is returned only by the response that creates it. It is not written to the
        idempotency store, audit payload, or logs. A repeated call after creation does not return the token.
      tags: [Tenant Management]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201':
          description: Invitation created. adminInviteToken is omitted on an idempotent replay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId: { type: string, format: uuid }
                  inviteId: { type: string, format: uuid }
                  adminInviteToken: { type: string }
                  invitationStatus: { type: string, enum: [CREATED] }
                  expiresAt: { type: string, format: date-time }
        '409': { description: An initial invitation was already created }
        '503': { description: The customer identity invite contract is unavailable. No token is returned. }

  /opening-balance/import:
    post:
      operationId: importOpeningBalance
      summary: Import opening balance data (inventory, AR, AP)
      description: |
        Run with dryRun=true first to preview errors.
        Run with dryRun=false to commit.
        CSV file must be uploaded to GCS and path provided.
      tags: [Opening Balance Migration]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpeningBalanceImportRequest' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpeningBalanceResult' }
        '400': { description: File not found or malformed }
