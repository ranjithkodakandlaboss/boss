openapi: "3.1.0"
info:
  title: BOSS Configurable Reference Data API
  version: "1.0.0"
  description: |
    Tenant-configurable business values: categories, reasons, production stages,
    inspection types, and all other domain-specific dropdown options.

    **Frontend rule:** Every dropdown must call GET /api/v1/config/options/{categoryCode}
    to populate options. Never hard-code option lists.

    **Historical records rule:** When selecting an option, store both the option ID
    (for joins) and a label snapshot (for display if option is later renamed/deactivated).

    See 18_CONFIGURABLE_BUSINESS_VALUES/design.md for the full design.

servers:
  - url: https://api.boss.app/api/v1

security:
  - firebaseBearer: []

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ConfigOption:
      type: object
      required: [id, categoryCode, code, label, sortOrder, isActive]
      properties:
        id: { type: string, format: uuid }
        categoryCode: { type: string }
        code: { type: string }
        label: { type: string }
        shortLabel: { type: string, nullable: true }
        description: { type: string, nullable: true }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        isSystem: { type: boolean, description: "System-seeded; tenant cannot edit label" }
        parentId: { type: string, format: uuid, nullable: true }
        metadata: { type: object, nullable: true }

    ConfigCategory:
      type: object
      properties:
        code: { type: string }
        domain: { type: string }
        label: { type: string }
        valueType: { type: string, enum: [SIMPLE, ORDERED, HIERARCHICAL, TEMPLATE] }
        isOrdered: { type: boolean }
        allowsTenantAdd: { type: boolean }
        allowsTenantEdit: { type: boolean }
        allowsTenantDeactivate: { type: boolean }
        isSystemProtected: { type: boolean }

    CreateOptionRequest:
      type: object
      required: [code, label]
      properties:
        code: { type: string, minLength: 1, maxLength: 100 }
        label: { type: string, minLength: 1, maxLength: 200 }
        shortLabel: { type: string, nullable: true }
        description: { type: string, nullable: true }
        sortOrder: { type: integer, nullable: true }
        parentId: { type: string, format: uuid, nullable: true }
        metadata: { type: object, nullable: true }

    RoutingTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, active, superseded, archived] }
        isSystem: { type: boolean }
        stages:
          type: array
          items: { $ref: '#/components/schemas/RoutingStage' }

    RoutingStage:
      type: object
      required: [stageName, stageCode, seqNo]
      properties:
        id: { type: string, format: uuid }
        stageName: { type: string }
        stageCode: { type: string }
        seqNo: { type: integer }
        department: { type: string, nullable: true }
        expectedDurationHrs: { type: number, nullable: true }
        requiresInspection: { type: boolean }
        requiresApproval: { type: boolean }
        isMandatory: { type: boolean }
        canSkip: { type: boolean }
        allowsRework: { type: boolean }
        blocksNextStage: { type: boolean }
        requiresEvidence: { type: boolean }
        inspectionTemplateId: { type: string, format: uuid, nullable: true }
        stageConfigOptionId: { type: string, format: uuid, nullable: true }

    ProblemDetail:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

paths:
  /config/categories:
    get:
      operationId: listConfigCategories
      summary: List all available configuration categories for this tenant
      tags: [Configuration]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfigCategory' }

  /config/options/{categoryCode}:
    get:
      operationId: getConfigOptions
      summary: Get all active options for a configuration category
      description: |
        Returns tenant's options (system defaults + tenant additions), filtered to isActive=true by default.
        Use includeInactive=true to see deactivated options (for historical display).
      tags: [Configuration]
      parameters:
        - name: categoryCode
          in: path
          required: true
          schema: { type: string }
          description: |
            One of: ITEM_CATEGORY, PRODUCTION_STAGE, INSPECTION_TYPE, DEFECT_CATEGORY,
            REJECTION_REASON_QUALITY, ASSET_TYPE, BREAKDOWN_REASON, MAINTENANCE_CATEGORY,
            RFQ_TYPE, CUSTOMER_TYPE, PR_TYPE, SUPPLIER_CATEGORY, DISPATCH_METHOD,
            PACKING_TYPE, PAYMENT_METHOD, EXPENSE_CATEGORY, ... (full list in design.md)
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Options list
          content:
            application/json:
              schema:
                type: object
                properties:
                  categoryCode: { type: string }
                  categoryLabel: { type: string }
                  isOrdered: { type: boolean }
                  options:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigOption' }
        '404': { description: Unknown category code }

    post:
      operationId: addConfigOption
      summary: Add a tenant-defined option to a category
      description: OWNER role required. Category must allow tenant additions (allowsTenantAdd=true).
      tags: [Configuration]
      parameters:
        - name: categoryCode
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOptionRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigOption' }
        '400': { description: Validation error or category does not allow additions }
        '403': { description: OWNER role required }
        '409': { description: Option code already exists in this category for this tenant }

  /config/options/{categoryCode}/{optionId}:
    put:
      operationId: updateConfigOption
      summary: Update the label of a tenant option
      description: OWNER role required. System options (isSystem=true) cannot have label changed.
      tags: [Configuration]
      parameters:
        - name: categoryCode
          in: path
          required: true
          schema: { type: string }
        - name: optionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigOption' }
        '400': { description: Cannot edit label of system option }
        '403': { description: OWNER role required }
        '404': { description: Option not found }

    delete:
      operationId: deactivateConfigOption
      summary: Deactivate an option (not delete — historical records preserved)
      description: |
        Deactivating an option does not delete it or rewrite historical transactions.
        Existing records retain their label snapshots; the option can later be reactivated.
      tags: [Configuration]
      parameters:
        - name: categoryCode
          in: path
          required: true
          schema: { type: string }
        - name: optionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Option deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: deactivated }
        '403': { description: OWNER role required }

  /config/options/{categoryCode}/{optionId}/status:
    patch:
      operationId: setConfigOptionStatus
      summary: Activate or deactivate a tenant option
      tags: [Configuration]
      parameters:
        - name: categoryCode
          in: path
          required: true
          schema: { type: string }
        - name: optionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200':
          description: Option status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [active, deactivated] }
        '403': { description: OWNER role required }

  /config/options/{categoryCode}/order:
    put:
      operationId: reorderOptions
      summary: Reorder active tenant-managed options in a category
      tags: [Configuration]
      parameters:
        - name: categoryCode
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionIds]
              properties:
                optionIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: reordered }
        '400': { description: Option list must contain every active tenant-managed option exactly once }
        '403': { description: OWNER role required }

  /config/routing-templates:
    get:
      operationId: listRoutingTemplates
      summary: List routing templates for this tenant
      tags: [Routing Templates]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, active, superseded, archived] }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoutingTemplate' }

    post:
      operationId: createRoutingTemplate
      summary: Create a new routing template with stages
      tags: [Routing Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, stages]
              properties:
                code: { type: string }
                name: { type: string }
                stages:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/RoutingStage' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingTemplate' }
        '400': { description: Validation error — duplicate seq_no or duplicate stage_code }
        '409': { description: Template code already exists }

  /config/routing-templates/{templateId}:
    get:
      operationId: getRoutingTemplate
      summary: Get a routing template with all stages
      tags: [Routing Templates]
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingTemplate' }
        '404': { description: Template not found }

    put:
      operationId: reviseRoutingTemplate
      summary: Create a new version of a routing template
      description: |
        Creates version N+1; sets previous version to status=superseded.
        Does NOT modify active jobs — they retain their original version.
      tags: [Routing Templates]
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, stages]
              properties:
                name: { type: string }
                stages:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/RoutingStage' }
      responses:
        '201':
          description: New version created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingTemplate' }

    delete:
      operationId: archiveRoutingTemplate
      summary: Archive a routing template
      description: Cannot archive if active production jobs reference this template.
      tags: [Routing Templates]
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Archived }
        '409': { description: Active jobs reference this template }
