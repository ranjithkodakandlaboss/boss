openapi: "3.1.0"
info:
  title: BOSS Procurement API
  version: "1.0.0"
  description: |
    Purchase Requisitions (PR), Supplier Quotations, Supplier Purchase Orders (SPO),
    and Supplier Performance tracking.

servers:
  - url: https://api.boss.app/api/v1

security:
  - firebaseBearer: []

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PurchaseRequisition:
      type: object
      properties:
        id: { type: string, format: uuid }
        prNumber: { type: string }
        originType: { type: string, enum: [MANUAL, PRODUCTION_JOB, STOCK_DRIVEN, CUSTOMER_PO] }
        jobId: { type: string, format: uuid, nullable: true }
        customerPoId:
          type: string
          format: uuid
          nullable: true
          description: Originating Customer PO when originType is CUSTOMER_PO. One open requisition is kept per Customer PO.
        status: { type: string, enum: [draft, pending_approval, approved, partially_ordered, ordered, cancelled] }
        prTypeId: { type: string, format: uuid, nullable: true }
        prTypeLabel: { type: string, nullable: true }
        requiredDate: { type: string, format: date, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PRLine' }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: string, format: uuid, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }

    PRLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        itemId: { type: string, format: uuid }
        itemCode: { type: string }
        itemName: { type: string }
        qty: { type: number }
        uomSymbol: { type: string }
        requiredDate: { type: string, format: date, nullable: true }
        note: { type: string, nullable: true }

    SupplierQuotation:
      type: object
      required: [id, prId, supplierId, supplierName, status, lines]
      properties:
        id: { type: string, format: uuid }
        prId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        status: { type: string, enum: [requested, received, under_review, selected, rejected] }
        validUntil: { type: string, format: date, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SupplierQuotationLine' }

    SupplierQuotationLine:
      type: object
      required: [id, prLineId, itemId, unitPrice, isSelected]
      properties:
        id: { type: string, format: uuid }
        prLineId: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        unitPrice: { type: number }
        leadTimeDays: { type: integer, nullable: true }
        isSelected:
          type: boolean
          description: True when this quotation line has been included in an SPO.
        grade: { type: string, nullable: true, maxLength: 200 }

    SupplierQuotationComparison:
      type: object
      required: [prId, lines]
      properties:
        prId: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [prLineId, itemId, itemCode, itemName, quantity, uomId, uomSymbol, offers]
            properties:
              prLineId: { type: string, format: uuid }
              itemId: { type: string, format: uuid }
              itemCode: { type: string }
              itemName: { type: string }
              quantity: { type: number }
              uomId: { type: string, format: uuid }
              uomSymbol: { type: string }
              offers:
                type: array
                items:
                  type: object
                  required: [supplierQuotationId, supplierId, supplierName, status, unitPrice, isSelected]
                  properties:
                    supplierQuotationId: { type: string, format: uuid }
                    supplierId: { type: string, format: uuid }
                    supplierName: { type: string }
                    status: { type: string, enum: [requested, received, under_review, selected, rejected] }
                    unitPrice: { type: number }
                    leadTimeDays: { type: integer, nullable: true }
                    validUntil: { type: string, format: date, nullable: true }
                    isSelected: { type: boolean }
                    grade: { type: string, nullable: true }

    SPO:
      type: object
      required: [id, spoNumber, prId, supplierQuotationId, supplierId, supplierName, status, lines, totalAmount, createdAt]
      properties:
        id: { type: string, format: uuid }
        spoNumber: { type: string }
        prId: { type: string, format: uuid }
        supplierQuotationId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        status: { type: string, enum: [draft, issued, acknowledged, partially_received, fully_received, cancelled] }
        committedDate: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SPOLine' }
        totalAmount: { type: number }
        createdAt: { type: string, format: date-time }

    SPOLine:
      type: object
      required: [id, itemId, itemCode, itemName, orderedQty, receivedQty, unitPrice, lineTotal]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemCode: { type: string }
        itemName: { type: string }
        orderedQty: { type: number }
        receivedQty: { type: number }
        unitPrice: { type: number }
        lineTotal: { type: number }
        expectedDeliveryDate: { type: string, format: date, nullable: true }

paths:
  /prs/{prId}/supplier-quotations:
    get:
      operationId: listSupplierQuotations
      summary: List supplier quotations for a purchase requisition
      tags: [Supplier Quotations]
      parameters:
        - name: prId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/SupplierQuotation' } }
                  page: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer }

    post:
      operationId: createSupplierQuotationRequest
      summary: Request a supplier quotation for an approved purchase requisition
      tags: [Supplier Quotations]
      parameters:
        - name: prId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId]
              properties:
                supplierId: { type: string, format: uuid }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierQuotation' }
        '403': { description: PURCHASE_MANAGER or OWNER role required }
        '404': { description: Purchase requisition or supplier not found }
        '409': { description: Purchase requisition is not approved }

  /prs/{prId}/supplier-quotations/comparison:
    get:
      operationId: compareSupplierQuotations
      summary: Compare supplier quotation offers by purchase requisition line
      tags: [Supplier Quotations]
      parameters:
        - name: prId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierQuotationComparison' }

  /supplier-quotations/{quotationId}:
    get:
      operationId: getSupplierQuotation
      tags: [Supplier Quotations]
      parameters:
        - name: quotationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierQuotation' }
        '404': { description: Supplier quotation not found }

  /supplier-quotations/{quotationId}/receive:
    post:
      operationId: receiveSupplierQuotation
      summary: Record supplier quotation details and lines
      tags: [Supplier Quotations]
      parameters:
        - name: quotationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                validUntil: { type: string, format: date, nullable: true }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [prLineId, unitPrice]
                    properties:
                      prLineId: { type: string, format: uuid }
                      unitPrice: { type: number, minimum: 0 }
                      leadTimeDays: { type: integer, minimum: 0, nullable: true }
                      grade: { type: string, nullable: true, maxLength: 200 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierQuotation' }
        '409': { description: Quotation is not in requested state }

  /supplier-quotations/{quotationId}/review:
    post:
      operationId: startSupplierQuotationReview
      tags: [Supplier Quotations]
      parameters:
        - name: quotationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierQuotation' }
        '409': { description: Quotation is not in received state }

  /supplier-quotations/{quotationId}/select:
    post:
      operationId: selectSupplierQuotation
      tags: [Supplier Quotations]
      parameters:
        - name: quotationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierQuotation' }
        '409': { description: Quotation is not in under_review state }

  /supplier-quotations/{quotationId}/reject:
    post:
      operationId: rejectSupplierQuotation
      tags: [Supplier Quotations]
      parameters:
        - name: quotationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierQuotation' }
        '409': { description: Quotation is not in under_review state }

  /prs:
    get:
      operationId: listPRs
      summary: List Purchase Requisitions
      tags: [Purchase Requisitions]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, issued, acknowledged, partially_received, fully_received, cancelled] }
        - name: originType
          in: query
          schema: { type: string }
        - name: customerPoId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/PurchaseRequisition' } }
                  page: { type: integer }
                  totalElements: { type: integer }

    post:
      operationId: createPR
      summary: Create a Purchase Requisition
      tags: [Purchase Requisitions]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                originType: { type: string, enum: [MANUAL, PRODUCTION_JOB, STOCK_DRIVEN, CUSTOMER_PO], default: MANUAL }
                jobId: { type: string, format: uuid, nullable: true }
                customerPoId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Required when originType is CUSTOMER_PO. Repeating the request returns the existing open requisition.
                prTypeId: { type: string, format: uuid, nullable: true }
                prTypeLabel: { type: string, nullable: true }
                requiredDate: { type: string, format: date, nullable: true }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, qty, uomId]
                    properties:
                      itemId: { type: string, format: uuid }
                      qty: { type: number, minimum: 0.001 }
                      uomId: { type: string, format: uuid }
                      requiredDate: { type: string, format: date, nullable: true }
                      note: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRequisition' }

  /prs/{prId}/approve:
    post:
      operationId: approvePR
      summary: Approve a PR (PURCHASE_MANAGER or OWNER role)
      tags: [Purchase Requisitions]
      parameters:
        - name: prId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRequisition' }
        '403': { description: PURCHASE_MANAGER or OWNER role required }
        '409': { description: PR is not in pending_approval state }

  /spos:
    get:
      operationId: listSPOs
      summary: List Supplier Purchase Orders
      tags: [SPO]
      parameters:
        - name: supplierId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/SPO' } }
                  page: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer }

    post:
      operationId: createSPO
      summary: Create a Supplier Purchase Order from selected supplier quotation
      tags: [SPO]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, prId, supplierQuotationId, lines]
              properties:
                supplierId: { type: string, format: uuid }
                prId: { type: string, format: uuid }
                supplierQuotationId:
                  type: string
                  format: uuid
                  description: Must identify a selected supplier quotation for this PR and supplier.
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [prLineId, itemId, orderedQty, unitPrice, uomId]
                    properties:
                      prLineId: { type: string, format: uuid }
                      itemId: { type: string, format: uuid }
                      orderedQty: { type: number }
                      unitPrice: { type: number }
                      uomId: { type: string, format: uuid }
                      expectedDeliveryDate: { type: string, format: date, nullable: true }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SPO' }

  /spos/{spoId}:
    get:
      operationId: getSPO
      tags: [SPO]
      parameters:
        - name: spoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SPO' }
        '404': { description: SPO not found }

  /spos/{spoId}/issue:
    post:
      operationId: issueSPO
      tags: [SPO]
      parameters:
        - name: spoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                committedDate: { type: string, format: date, nullable: true }
                notes: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SPO' }
        '409': { description: SPO is not in draft state }

  /spos/{spoId}/acknowledge:
    post:
      operationId: acknowledgeSPO
      tags: [SPO]
      parameters:
        - name: spoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SPO' }
        '409': { description: SPO is not in issued state }

  /spos/{spoId}/cancel:
    post:
      operationId: cancelSPO
      tags: [SPO]
      parameters:
        - name: spoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SPO' }
        '409': { description: SPO cannot be cancelled from its current state }

  /suppliers/{supplierId}/invite:
    post:
      operationId: inviteSupplier
      summary: Send portal invitation to supplier contact
      tags: [Supplier Management]
      parameters:
        - name: supplierId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                contactName: { type: string }
      responses:
        '200':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  supplierId: { type: string, format: uuid }
                  invitedEmail: { type: string }
                  invitedAt: { type: string, format: date-time }
        '409':
          description: Supplier already has active portal account

  /supplier-performance:
    get:
      operationId: listSupplierPerformance
      summary: List supplier performance summaries
      description: Aggregated on-time delivery, quality rejection, and lead-time metrics per supplier.
      tags: [Supplier Management]
      parameters:
        - name: supplierId
          in: query
          schema: { type: string, format: uuid }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        supplierId: { type: string, format: uuid }
                        supplierName: { type: string }
                        totalOrders: { type: integer }
                        onTimeDeliveryPct: { type: number }
                        qualityRejectionPct: { type: number }
                        avgLeadTimeDays: { type: number }
                        periodFrom: { type: string, format: date }
                        periodTo: { type: string, format: date }
                  totalElements: { type: integer }
                  page: { type: integer }
                  size: { type: integer }
