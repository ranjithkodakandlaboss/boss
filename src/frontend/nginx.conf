server {
    listen 8080;
    server_name localhost;

    # For /assets paths, try the exact file first (Vite hashed assets like /assets/index-abc.js),
    # then fall back to index.html (SPA routes like /assets, /assets/:id, /assets/me/:id).
    # Without this, nginx resolves /assets as the /assets/ directory and returns 403.
    location ~ ^/assets {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
