steps:
  # Build the JAR from source using Maven
  - name: 'eclipse-temurin:21-jdk-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'apk add --no-cache maven && cd backend && mvn -B -ntp package -DskipTests'
    id: 'build-jar'

  # Build the runtime image (no BuildKit required)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--platform'
      - 'linux/amd64'
      - '-t'
      - '${_IMAGE}'
      - '-f'
      - 'Dockerfile.runtime'
      - '.'
    waitFor: ['build-jar']
    id: 'build-image'

images:
  - '${_IMAGE}'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE: 'asia-south1-docker.pkg.dev/boss-dev-514813/boss-docker/boss-api:cloudbuild-latest'
