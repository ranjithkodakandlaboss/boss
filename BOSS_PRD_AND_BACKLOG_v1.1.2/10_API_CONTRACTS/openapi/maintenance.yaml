openapi: "3.1.0"
info:
  title: BOSS Maintenance API
  version: "1.0.0"
  description: |
    Asset register and maintenance work orders (EPIC-15 — P2-DESIRABLE).
    **Status: DEFERRED from MVP.** These endpoints must not be called by EPIC-01 through EPIC-14 stories.
    Implementation begins only after Ranjith approves EPIC-15 start.

servers:
  - url: https://api.boss.app/api/v1

security:
  - firebaseBearer: []

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetCode: { type: string }
        name: { type: string }
        assetTypeId: { type: string, format: uuid }
        assetTypeLabel: { type: string }
        location: { type: string, nullable: true }
        serialNumber: { type: string, nullable: true }
        purchaseDate: { type: string, format: date, nullable: true }
        purchaseCost: { type: number, nullable: true }
        status: { type: string, enum: [active, under_maintenance, decommissioned] }
        createdAt: { type: string, format: date-time }

    AssetCreateRequest:
      type: object
      required: [assetCode, name, assetTypeId, status]
      properties:
        assetCode: { type: string }
        name: { type: string }
        assetTypeId: { type: string, format: uuid }
        location: { type: string, nullable: true }
        serialNumber: { type: string, nullable: true }
        purchaseDate: { type: string, format: date, nullable: true }
        purchaseCost: { type: number, nullable: true }
        status: { type: string, enum: [active, under_maintenance, decommissioned], default: active }

    WorkOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        woNumber: { type: string }
        assetId: { type: string, format: uuid }
        assetCode: { type: string }
        assetName: { type: string }
        workTypeId: { type: string, format: uuid, nullable: true }
        workTypeLabel: { type: string, nullable: true }
        description: { type: string }
        priority: { type: string, enum: [low, medium, high, critical] }
        status: { type: string, enum: [open, in_progress, completed, cancelled] }
        scheduledDate: { type: string, format: date, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        completionNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    WorkOrderCreateRequest:
      type: object
      required: [assetId, description, priority]
      properties:
        assetId: { type: string, format: uuid }
        workTypeId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        priority: { type: string, enum: [low, medium, high, critical] }
        scheduledDate: { type: string, format: date, nullable: true }

    WorkOrderCompleteRequest:
      type: object
      required: [completionNote]
      properties:
        completionNote: { type: string }

    PagedAssets:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        page: { type: integer }
        size: { type: integer }

    PagedWorkOrders:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/WorkOrder' } }
        totalElements: { type: integer }
        totalPages: { type: integer }
        page: { type: integer }
        size: { type: integer }

paths:
  /assets:
    get:
      operationId: listAssets
      summary: List assets
      tags: [Assets]
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: assetTypeId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedAssets' }
    post:
      operationId: createAsset
      summary: Create asset
      tags: [Assets]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetCreateRequest' }
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }

  /assets/{id}:
    get:
      operationId: getAsset
      summary: Get asset by ID
      tags: [Assets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        "404":
          description: Not found
    patch:
      operationId: updateAsset
      summary: Update asset status or details
      tags: [Assets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, under_maintenance, decommissioned] }
                location: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }

  /work-orders:
    get:
      operationId: listWorkOrders
      summary: List work orders
      tags: [Work Orders]
      parameters:
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedWorkOrders' }
    post:
      operationId: createWorkOrder
      summary: Create work order
      tags: [Work Orders]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderCreateRequest' }
      responses:
        "201":
          description: Work order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }

  /work-orders/{id}:
    get:
      operationId: getWorkOrder
      summary: Get work order by ID
      tags: [Work Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }

  /work-orders/{id}/complete:
    post:
      operationId: completeWorkOrder
      summary: Mark work order complete
      tags: [Work Orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkOrderCompleteRequest' }
      responses:
        "200":
          description: Work order completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        "409":
          description: Already completed or cancelled
