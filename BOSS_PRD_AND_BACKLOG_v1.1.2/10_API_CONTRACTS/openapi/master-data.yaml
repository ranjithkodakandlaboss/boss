openapi: "3.1.0"
info:
  title: BOSS Master Data API
  version: "1.0.0"
  description: |
    Items, Units of Measure, Bill of Materials, Routing Templates,
    Customers, and Suppliers.

    **Item categories:** Use GET /api/v1/config/options/ITEM_CATEGORY for item category selection.
    Category ID is stored with item; label snapshot is stored for history.

servers:
  - url: https://api.boss.app/api/v1

security:
  - firebaseBearer: []

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Item:
      type: object
      required: [id, code, name, itemType, uomId, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        itemType:
          type: string
          enum: [RAW_MATERIAL, CONSUMABLE, FINISHED_GOOD, SERVICE, SPARE_PART, SEMI_FINISHED]
        categoryId: { type: string, format: uuid, nullable: true }
        categoryLabel: { type: string, nullable: true, description: "Snapshot label" }
        uomId: { type: string, format: uuid }
        uomSymbol: { type: string }
        hsnCode: { type: string, nullable: true }
        gstRate: { type: number, nullable: true }
        standardCost: { type: number, nullable: true }
        reorderPoint: { type: number, nullable: true }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }

    CreateItemRequest:
      type: object
      required: [code, name, itemType, uomId]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true }
        itemType:
          type: string
          enum: [RAW_MATERIAL, CONSUMABLE, FINISHED_GOOD, SERVICE, SPARE_PART, SEMI_FINISHED]
        categoryId: { type: string, format: uuid, nullable: true }
        categoryLabel: { type: string, nullable: true }
        uomId: { type: string, format: uuid }
        hsnCode: { type: string, nullable: true }
        standardCost: { type: number, nullable: true, minimum: 0 }
        reorderPoint: { type: number, nullable: true, minimum: 0 }

    UOM:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        symbol: { type: string }
        uomType: { type: string, enum: [quantity, weight, volume, length, area, time, energy, other] }
        isBase: { type: boolean }

    BOMHeader:
      type: object
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemCode: { type: string }
        itemName: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, active, superseded] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/BOMLine' }

    BOMLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        componentItemId: { type: string, format: uuid }
        componentItemCode: { type: string }
        componentItemName: { type: string }
        qty: { type: number }
        uomId: { type: string, format: uuid }
        uomSymbol: { type: string }
        scrapFactor: { type: number, default: 0 }
        level: { type: integer, description: "Nesting level (0 = top)" }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        gstin: { type: string, nullable: true }
        pan: { type: string, nullable: true }
        customerTypeId: { type: string, format: uuid, nullable: true }
        customerTypeLabel: { type: string, nullable: true }
        address: { type: object, nullable: true }
        status: { type: string, enum: [active, inactive] }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/Contact' }

    Supplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        gstin: { type: string, nullable: true }
        pan: { type: string, nullable: true }
        supplierCategoryId: { type: string, format: uuid, nullable: true }
        supplierCategoryLabel: { type: string, nullable: true }
        address: { type: object, nullable: true }
        status: { type: string, enum: [active, inactive] }
        performanceScore: { type: number, nullable: true, description: "0-100 calculated from GRN outcomes" }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/Contact' }

    Contact:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        isPrimary: { type: boolean }

    BOMExplosionResult:
      type: object
      properties:
        itemId: { type: string, format: uuid }
        flatMaterials:
          type: array
          items:
            type: object
            properties:
              itemId: { type: string, format: uuid }
              itemCode: { type: string }
              itemName: { type: string }
              qty: { type: number }
              uomSymbol: { type: string }
              level: { type: integer }

    ProblemDetail:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

paths:
  /items:
    get:
      operationId: listItems
      summary: List items with filter
      tags: [Items]
      parameters:
        - name: itemType
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: q
          in: query
          schema: { type: string }
          description: Search by code or name (prefix match)
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/Item' } }
                  page: { type: integer }
                  totalElements: { type: integer }

    post:
      operationId: createItem
      summary: Create a new item
      tags: [Items]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { description: Validation error }
        '409': { description: Item code already exists for this tenant }

  /items/{itemId}:
    get:
      operationId: getItem
      tags: [Items]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404': { description: Item not found }

    patch:
      operationId: updateItem
      summary: Update item (name, description, HSN, standard cost, status)
      tags: [Items]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }

  /items/{itemId}/bom:
    get:
      operationId: getItemBOM
      summary: Get active BOM for an item
      tags: [BOM]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BOMHeader' }
        '404': { description: No active BOM for this item }

    post:
      operationId: createOrReviseBOM
      summary: Create or revise the BOM for an item
      description: If a BOM exists, creates a new version and supersedes the previous.
      tags: [BOM]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [componentItemId, qty, uomId]
                    properties:
                      componentItemId: { type: string, format: uuid }
                      qty: { type: number, minimum: 0.001 }
                      uomId: { type: string, format: uuid }
                      scrapFactor: { type: number, default: 0, minimum: 0, maximum: 100 }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BOMHeader' }
        '400': { description: Circular reference or max 5 levels exceeded }

  /items/{itemId}/bom/explode:
    get:
      operationId: explodeBOM
      summary: Flatten BOM into all leaf-level raw materials
      tags: [BOM]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: qty
          in: query
          schema: { type: number, default: 1 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BOMExplosionResult' }

  /customers:
    get:
      operationId: listCustomers
      tags: [Customers]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/Customer' } }
                  page: { type: integer }
                  totalElements: { type: integer }

    post:
      operationId: createCustomer
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                gstin: { type: string, nullable: true, pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$' }
                pan: { type: string, nullable: true, pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$' }
                customerTypeId: { type: string, format: uuid, nullable: true }
                customerTypeLabel: { type: string, nullable: true }
                address: { type: object, nullable: true }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { description: Invalid GSTIN format }
        '409': { description: Customer code already exists }

  /customers/{customerId}:
    get:
      operationId: getCustomer
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '404': { description: Customer not found }

    patch:
      operationId: updateCustomer
      tags: [Customers]
      parameters:
        - name: customerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [Suppliers]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: array, items: { $ref: '#/components/schemas/Supplier' } }
                  page: { type: integer }
                  totalElements: { type: integer }

    post:
      operationId: createSupplier
      tags: [Suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                gstin: { type: string, nullable: true }
                supplierCategoryId: { type: string, format: uuid, nullable: true }
                supplierCategoryLabel: { type: string, nullable: true }
                address: { type: object, nullable: true }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }

  /uoms:
    get:
      operationId: listUOMs
      tags: [Units of Measure]
      parameters:
        - name: uomType
          in: query
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UOM' }
